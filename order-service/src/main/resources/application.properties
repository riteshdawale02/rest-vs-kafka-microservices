spring.application.name=order-service
server.port=${SERVER_PORT:8080}

# --- Database (override via environment variables) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/orderdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Actuator / Prometheus ---
management.endpoints.web.exposure.include=health,metrics,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# --- Communication mode: REST | KAFKA (exactly one is active) ---
communication.mode=${COMMUNICATION_MODE:REST}

# --- REST mode ---
payment.service.url=${PAYMENT_SERVICE_URL:http://localhost:8081}
payment.service.connect-timeout-ms=2000
payment.service.read-timeout-ms=5000

# --- Kafka mode ---
kafka.topic.orders=${KAFKA_TOPIC_ORDERS:orders}
kafka.topic.partitions=${KAFKA_TOPIC_PARTITIONS:3}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.LongSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
# do not send Java class names in headers; the consumer uses its own event class
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.properties.linger.ms=0
# fail fast (~5-10 s) instead of Kafka's 60 s default when the broker is unreachable
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
