# Monitoring add-on. Use together with docker-compose.yml:
#   $env:COMPOSE_FILE = "docker-compose.yml;docker-compose.monitoring.yml"     (PowerShell)
# Then every normal "docker compose ..." command includes monitoring.

services:
  order-service:
    environment:
      SERVER_TOMCAT_MBEANREGISTRY_ENABLED: "true"   # exposes tomcat_threads_* metrics
  payment-service:
    environment:
      SERVER_TOMCAT_MBEANREGISTRY_ENABLED: "true"

  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    ports:
      - "8082:8080"
