spring.application.name=payment-service
server.port=${SERVER_PORT:8081}

# --- Database (override via environment variables) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/paymentdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Actuator / Prometheus ---
management.endpoints.web.exposure.include=health,metrics,prometheus
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# --- Communication mode: REST | KAFKA ---
# REST  : only the REST endpoints are used; no Kafka consumer is created.
# KAFKA : the Kafka consumer is active (REST endpoints stay available).
communication.mode=${COMMUNICATION_MODE:REST}

# --- Kafka consumer ---
kafka.topic.orders=${KAFKA_TOPIC_ORDERS:orders}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:payment-service-group}
# new group (or no committed offset) -> read the topic from the beginning
spring.kafka.consumer.auto-offset-reset=earliest
# ErrorHandlingDeserializer: a malformed message becomes a handled error, not an endless poll failure
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.LongDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.value.default.type=com.example.paymentservice.event.OrderCreatedEvent
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=com.example.paymentservice.event
# consumer threads (must be <= topic partitions to be useful)
spring.kafka.listener.concurrency=${KAFKA_LISTENER_CONCURRENCY:3}
